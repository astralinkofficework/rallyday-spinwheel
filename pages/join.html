<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join the Spin — Rally Day</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23ff2d92'/></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="bg-decoration">
  <div class="bg-blob"></div>
  <div class="bg-blob"></div>
  <div class="bg-blob"></div>
</div>
<div class="bg-grid"></div>


<main id="form-page" class="page">
  <div class="form-card">
    <div class="form-icon">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="24" cy="20" r="14"/>
        <circle cx="24" cy="20" r="2.5" fill="currentColor"/>
        <path d="M24 6v28M10 20h28M14.1 10.1l19.8 19.8M33.9 10.1L14.1 29.9"/>
        <path d="M18 44h12M20 44V34M28 44V34"/>
      </svg>
    </div>
    <h1 class="form-title">Join the Spin!</h1>
    <div class="form-stats">
      <span class="form-stats-dot"></span>
      <span id="formEntryCount">0</span> already in the draw
    </div>
    <form id="joinForm" autocomplete="off">
      <div id="closedBanner" style="display:none;background:rgba(255,51,102,.15);border:1px solid rgba(255,51,102,.4);color:var(--red);padding:.85rem;border-radius:12px;font-weight:700;margin-bottom:1rem;text-align:center">Submissions are currently closed</div>
      <div class="form-group">
        <label class="form-label" for="nameInput">Your Name</label>
        <input type="text" id="nameInput" class="form-input" placeholder="e.g. Alex Chen" autocomplete="name" maxlength="30" required>
      </div>
      <button type="submit" class="form-submit" id="submitBtn">
        Join Now
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.8 11.3 2 22l10.7-3.79"/><path d="M4 3h.01M22 8h.01M15 2h.01M22 20h.01"/><path d="m22 2-2.24.75a2.9 2.9 0 0 0-1.96 3.12c.1.86-.57 1.63-1.45 1.63h-.38c-.86 0-1.6.6-1.76 1.44L14 10"/><path d="m22 13-1.29.37a2 2 0 0 1-2.42-1.29l-.13-.38"/></svg>
      </button>
    </form>
    <div class="form-message" id="formMessage"></div>
  </div>
</main>

<canvas class="confetti-canvas" id="confettiCanvas"></canvas>
<div class="toast" id="toast"></div>

<script src="../js/shared.js"></script>
<script src="../js/form.js"></script>
</body>
</html>
