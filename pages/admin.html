<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Rally Day</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23ff3366'/></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="bg-decoration">
  <div class="bg-blob"></div>
  <div class="bg-blob"></div>
  <div class="bg-blob"></div>
</div>
<div class="bg-grid"></div>

<main class="page" style="padding:2rem 1rem">
  <div style="max-width:1100px;margin:0 auto">

    <div id="loginSection">
      <div style="max-width:400px;margin:0 auto">
        <div style="background:var(--glass-bg);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:32px;padding:2.5rem;text-align:center">
          <h1 class="display" style="font-size:clamp(1.6rem,5vw,2.5rem);background:linear-gradient(135deg,var(--yellow),var(--pink));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-transform:uppercase;margin-bottom:.5rem">Admin Login</h1>
          <p style="color:var(--text-muted);font-size:.9rem;margin-bottom:2rem">Enter the admin password to continue</p>
          <form id="loginForm" autocomplete="off">
            <div class="form-group" style="text-align:left">
              <label class="form-label" for="adminPassword">Password</label>
              <input type="password" id="adminPassword" class="form-input" placeholder="Enter admin password" required autocomplete="current-password">
            </div>
            <button type="submit" class="form-submit" style="margin-top:1rem">
              Login
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
            </button>
          </form>
          <div class="form-message" id="loginMessage"></div>
        </div>
      </div>
    </div>

    <div id="adminPanel" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:1rem;margin-bottom:1.5rem">
        <div>
          <h1 class="display" style="font-size:clamp(1.6rem,5vw,2.5rem);background:linear-gradient(135deg,var(--yellow),var(--pink));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-transform:uppercase;margin-bottom:.25rem">Admin Panel</h1>
          <p style="color:var(--text-muted);font-size:.9rem">Manage entries, winners, and submissions</p>
        </div>
        <div style="display:flex;gap:.75rem;align-items:center;flex-wrap:wrap">
          <button class="admin-btn" id="submissionsToggle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>
            Close Submissions
          </button>
          <button class="admin-btn danger" id="resetBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
            Reset All
          </button>
          <button class="admin-btn" id="logoutBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Logout
          </button>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:1.5rem">
        <div class="admin-stat">
          <div class="admin-stat-label">Entries</div>
          <div class="admin-stat-value pink" id="entryCount">0</div>
        </div>
        <div class="admin-stat">
          <div class="admin-stat-label">Winners</div>
          <div class="admin-stat-value blue" id="winnerCount">0</div>
        </div>
        <div class="admin-stat">
          <div class="admin-stat-label">Submissions</div>
          <div class="admin-stat-value" id="submissionsStatus" style="color:var(--green)">Open</div>
        </div>
      </div>

      <div style="background:var(--glass-bg);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:24px;padding:1.25rem;margin-bottom:1.5rem">
        <div style="font-weight:800;font-size:.85rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);margin-bottom:.75rem;display:flex;align-items:center;gap:.5rem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;color:var(--pink)"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
          Add Participant to Wheel
        </div>
        <form id="adminAddEntryForm" style="display:flex;gap:.75rem;flex-wrap:wrap" autocomplete="off">
          <input type="text" id="adminAddNameInput" class="form-input" placeholder="Enter participant name..." style="flex:1;min-width:200px" maxlength="35" required>
          <button type="submit" class="admin-btn primary" id="adminAddEntryBtn" style="background:linear-gradient(135deg,var(--pink),var(--purple));border:none;box-shadow:0 4px 15px rgba(255,45,146,.35)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add to Wheel
          </button>
        </form>
      </div>

      <div style="background:var(--glass-bg);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:24px;padding:1.25rem;margin-bottom:1.5rem">
        <div style="display:flex;gap:.75rem;flex-wrap:wrap">
          <input type="text" id="searchInput" class="form-input" placeholder="Search by name..." style="flex:1;min-width:200px">
          <button class="admin-btn primary" id="searchBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            Search
          </button>
          <button class="admin-btn" id="clearSearchBtn">Clear</button>
        </div>
      </div>

      <div style="background:var(--glass-bg);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:24px;overflow:hidden">
        <div style="overflow-x:auto">
          <table style="width:100%;border-collapse:collapse;min-width:600px">
            <thead>
              <tr style="border-bottom:1px solid var(--glass-border)">
                <th style="text-align:left;padding:.85rem 1rem;font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--text-muted);font-weight:800">Name</th>
                <th style="text-align:left;padding:.85rem 1rem;font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--text-muted);font-weight:800">Joined</th>
                <th style="text-align:center;padding:.85rem 1rem;font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--text-muted);font-weight:800">Status</th>
                <th style="text-align:right;padding:.85rem 1rem;font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--text-muted);font-weight:800">Actions</th>
              </tr>
            </thead>
            <tbody id="entriesTable"></tbody>
          </table>
        </div>
        <div id="emptyState" style="display:none;text-align:center;padding:3rem 1rem;color:var(--text-muted);font-style:italic">
          No entries found
        </div>
        <div id="pagination" style="display:flex;justify-content:space-between;align-items:center;padding:1rem;border-top:1px solid var(--glass-border);flex-wrap:wrap;gap:.75rem"></div>
      </div>

      <div style="margin-top:1.5rem;background:var(--glass-bg);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:24px;padding:1.25rem">
        <h2 class="display" style="font-size:1.1rem;margin-bottom:1rem;text-transform:uppercase;color:var(--yellow)">Recent Winners</h2>
        <div id="winnersList" style="display:flex;flex-wrap:wrap;gap:.5rem"></div>
        <div id="winnersEmpty" style="color:var(--text-muted);font-style:italic;font-size:.9rem">No winners yet</div>
      </div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="../js/shared.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
